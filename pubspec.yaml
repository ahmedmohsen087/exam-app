name: exam_app
description: "Exam App"
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.8
  dio: ^5.9.2
  injectable:
  get_it:
  retrofit:
  logger:
  json_annotation:
  pretty_dio_logger: ^1.4.0
  flutter_screenutil:
  flutter_bloc:
  equatable: ^2.0.8
  flutter_secure_storage:
  flutter_svg: ^2.2.4
  pin_code_fields: ^8.0.1
  cached_network_image: ^3.4.1
  hive_ce:
  hive_ce_flutter:
  shared_preferences: ^2.5.5
  pinput: ^6.0.2
  intl: ^0.20.2
  percent_indicator: ^4.2.5

dev_dependencies:
  flutter_test:
    sdk: flutter

